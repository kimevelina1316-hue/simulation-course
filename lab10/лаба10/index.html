<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная: Агентное M/M/n + Queue</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 25px;
        }
        h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 22px; }
        
        .top-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) { .top-grid { grid-template-columns: 1fr; } }

        .panel {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
        }
        .panel-title {
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 16px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }
        .input-row label { width: 100px; font-weight: 500; }
        .input-row input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        #runBtn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #runBtn:hover { background: #2980b9; }

        #resultsText {
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            min-height: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Лабораторная: Агентное M/M/n</h1>
        
        <div class="top-grid">
            <!-- Панель параметров -->
            <div class="panel">
                <div class="panel-title">Параметры </div>
                <div class="input-row">
                    <label>λ (вход):</label>
                    <input type="number" id="ent_lam" value="5.0" step="0.1" min="0.1">
                </div>
                <div class="input-row">
                    <label>μ (обсл.):</label>
                    <input type="number" id="ent_mu" value="2.0" step="0.1" min="0.1">
                </div>
                <div class="input-row">
                    <label>n (серверы):</label>
                    <input type="number" id="ent_n" value="2" step="1" min="1">
                </div>
                <div class="input-row">
                    <label>Очередь:</label>
                    <input type="number" id="ent_q" value="10" step="1" min="0">
                </div>
                <button id="runBtn">Запустить симуляцию</button>
            </div>

            <!-- Панель результатов -->
            <div class="panel">
                <div class="panel-title">Результаты</div>
                <div id="resultsText">Нажмите 'Запустить'</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== КЛАССЫ (ООП) ====================
        class Client {
            constructor(arrivalTime, serviceDuration) {
                this.arrivalTime = arrivalTime;
                this.serviceDuration = serviceDuration;
                this.state = 'new';
                this.startServiceTime = null;
            }
        }

        class Server {
            constructor(serverId) {
                this.id = serverId;
                this.isBusy = false;
                this.freeAt = 0.0;
                this.currentClient = null;
            }
            assignClient(client, currentTime) {
                this.isBusy = true;
                this.currentClient = client;
                this.freeAt = currentTime + client.serviceDuration;
                client.startServiceTime = currentTime;
                client.state = 'serving';
            }
            release(currentTime) {
                this.isBusy = false;
                const finishedClient = this.currentClient;
                this.currentClient = null;
                finishedClient.state = 'done';
                return finishedClient;
            }
        }

        class QueueManager {
            constructor(maxSize) {
                this.maxSize = maxSize;
                this.clients = [];
            }
            add(client) {
                if (this.clients.length < this.maxSize) {
                    this.clients.push(client);
                    client.state = 'waiting';
                    return true;
                }
                return false;
            }
            pop() {
                return this.clients.length > 0 ? this.clients.shift() : null;
            }
            isFull() { return this.clients.length >= this.maxSize; }
            isEmpty() { return this.clients.length === 0; }
            size() { return this.clients.length; }
        }

        class SMOSystem {
            constructor(lam, mu, nServers, queueSize, tModel) {
                this.lam = lam;
                this.mu = mu;
                this.tModel = tModel;
                this.servers = Array.from({ length: nServers }, (_, i) => new Server(i));
                this.queue = new QueueManager(queueSize);
                
                this.totalArrived = 0;
                this.totalRefused = 0;
                this.totalServed = 0;
                this.totalWaitTime = 0.0;
                
                this.timeLog = [0.0];
                this.queueLog = [0];
                this.nextArrivalTime = this.expRand(lam);
            }

            expRand(rate) {
                return -Math.log(1 - Math.random()) / rate;
            }

            getNextDepartureInfo() {
                let minTime = Infinity;
                let activeServer = null;
                for (const server of this.servers) {
                    if (server.isBusy && server.freeAt < minTime) {
                        minTime = server.freeAt;
                        activeServer = server;
                    }
                }
                return { minTime, activeServer };
            }

            run() {
                let t = 0.0;
                while (t < this.tModel) {
                    const { minTime, activeServer } = this.getNextDepartureInfo();
                    
                    if (this.nextArrivalTime <= minTime) {
                        // СОБЫТИЕ: Приход клиента
                        t = this.nextArrivalTime;
                        this.totalArrived++;
                        
                        const serviceDur = this.expRand(this.mu);
                        const newClient = new Client(t, serviceDur);
                        let placed = false;
                        
                        for (const server of this.servers) {
                            if (!server.isBusy) {
                                server.assignClient(newClient, t);
                                placed = true;
                                break;
                            }
                        }
                        
                        if (!placed) {
                            if (!this.queue.isFull()) {
                                this.queue.add(newClient);
                                placed = true;
                            } else {
                                this.totalRefused++;
                                newClient.state = 'refused';
                            }
                        }
                        this.nextArrivalTime = t + this.expRand(this.lam);
                    } else {
                        // СОБЫТИЕ: Завершение обслуживания
                        t = minTime;
                        this.totalServed++;
                        
                        const finishedClient = activeServer.release(t);
                        if (finishedClient.startServiceTime !== null) {
                            this.totalWaitTime += finishedClient.startServiceTime - finishedClient.arrivalTime;
                        }
                        
                        if (!this.queue.isEmpty()) {
                            const nextClient = this.queue.pop();
                            activeServer.assignClient(nextClient, t);
                        }
                    }
                    
                    this.timeLog.push(t);
                    this.queueLog.push(this.queue.size());
                }
                
                const pRefuse = this.totalArrived > 0 ? this.totalRefused / this.totalArrived : 0;
                const pAcc = this.totalArrived > 0 ? this.totalServed / this.totalArrived : 0;
                const avgWait = this.totalServed > 0 ? this.totalWaitTime / this.totalServed : 0;
                
                return {
                    total: this.totalArrived,
                    nAccepted: this.totalServed,
                    nRefused: this.totalRefused,
                    pAcc, pRefuse, avgWait
                };
            }
        }

        // ==================== ЗАПУСК СИМУЛЯЦИИ ====================
        function runSimulation() {
            const resultsText = document.getElementById('resultsText');
            resultsText.textContent = 'Считаю...';
            
            setTimeout(() => {
                try {
                    const lam = parseFloat(document.getElementById('ent_lam').value);
                    const mu = parseFloat(document.getElementById('ent_mu').value);
                    const n = parseInt(document.getElementById('ent_n').value);
                    const q = parseInt(document.getElementById('ent_q').value);
                    
                    if (lam <= 0 || mu <= 0 || n <= 0 || q < 0) throw new Error();
                    
                    const T_MODEL = 1000.0;
                    const system = new SMOSystem(lam, mu, n, q, T_MODEL);
                    const res = system.run();
                    
                    const pAccPct = (res.pAcc * 100).toFixed(2);
                    const pRefPct = (res.pRefuse * 100).toFixed(2);
                    
                    resultsText.textContent = 
                        `Всего заявок:   ${res.total}\n` +
                        `Обслужено:      ${res.nAccepted} (${pAccPct}%)\n` +
                        `Отказов:        ${res.nRefused} (${pRefPct}%)\n` +
                        `Ср. время ож.:  ${res.avgWait.toFixed(4)} ед.\n` +
                        `-------------------------`;
                    
                } catch (e) {
                    resultsText.textContent = 'Ошибка: Проверьте параметры (должны быть > 0)';
                }
            }, 10);
        }

        // Инициализация
        document.getElementById('runBtn').addEventListener('click', runSimulation);
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('keypress', e => { if(e.key === 'Enter') runSimulation(); });
        });
    </script>
</body>
</html>
