<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №8</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-size: 24px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 800px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-panel {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .control-panel {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 14px;
            color: #b0b0b0;
        }

        input {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
        }

        /* Стили для ошибок валидации */
        input.error {
            border-color: #dc3545;
            box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.25);
        }

        input.success {
            border-color: #28a745;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            min-height: 16px;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .log-panel {
            margin-top: 20px;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            color: #a9a9a9;
        }

        .log-title {
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 5px;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Лабораторная работа №8</h1>

    <div class="content-grid">
        <div class="chart-panel">
            <h3 style="text-align: center; margin-top: 0;">Эмпирическое распределение числа запросов</h3>
            <canvas id="myChart"></canvas>
        </div>

        <div class="control-panel">
            <h3 style="margin-top: 0;">Параметры системы</h3>
            
            <div class="input-group">
                <label for="lambdaInput">Интенсивность (λ), событий/ед.времени:</label>
                <input type="number" id="lambdaInput" value="5.0" step="0.1" min="0.01" max="100">
                <span class="error-message" id="lambdaError"></span>
            </div>

            <div class="input-group">
                <label for="tInput">Интервал контроля (T), ед.времени:</label>
                <input type="number" id="tInput" value="1.0" step="0.1" min="0.1" max="100">
                <span class="error-message" id="tError"></span>
            </div>

            <div class="input-group">
                <label for="nInput">Количество опытов (N):</label>
                <input type="number" id="nInput" value="1000" step="1" min="10" max="50000">
                <span class="error-message" id="nError"></span>
            </div>

            <button id="runBtn" onclick="runSimulation()">ЗАПУСТИТЬ МОДЕЛИРОВАНИЕ</button>

            <div class="log-panel" id="logOutput">
                <span class="log-title">> Лог выполнения:</span>
                Ожидание запуска...
            </div>
        </div>
    </div>
</div>

<script>
    // --- Конфигурация генератора ---
    const M = 9223372036854775808n; 
    const beta = 4294967299n;
    let state = BigInt(Math.floor(Date.now())); 

    function nextRandom() {
        state = (beta * state) % M;
        return Number(state) / Number(M);
    }

    let chartInstance = null;

    // === ФУНКЦИИ ВАЛИДАЦИИ ===
    
    function clearValidation() {
        document.querySelectorAll('input').forEach(input => {
            input.classList.remove('error', 'success');
        });
        document.querySelectorAll('.error-message').forEach(span => {
            span.textContent = '';
            span.classList.remove('visible');
        });
    }

    function showError(inputId, errorId, message) {
        const input = document.getElementById(inputId);
        const error = document.getElementById(errorId);
        input.classList.add('error');
        input.classList.remove('success');
        error.textContent = message;
        error.classList.add('visible');
    }

    function showSuccess(inputId) {
        const input = document.getElementById(inputId);
        input.classList.remove('error');
        input.classList.add('success');
    }

    function validateInputs() {
        let isValid = true;
        clearValidation();

        // Валидация λ
        const lambda = parseFloat(document.getElementById('lambdaInput').value);
        if (isNaN(lambda)) {
            showError('lambdaInput', 'lambdaError', 'Введите число');
            isValid = false;
        } else if (lambda <= 0) {
            showError('lambdaInput', 'lambdaError', 'λ должна быть > 0');
            isValid = false;
        } else if (lambda > 100) {
            showError('lambdaInput', 'lambdaError', 'λ слишком велика (макс. 100)');
            isValid = false;
        } else {
            showSuccess('lambdaInput');
        }

        // Валидация T
        const T = parseFloat(document.getElementById('tInput').value);
        if (isNaN(T)) {
            showError('tInput', 'tError', 'Введите число');
            isValid = false;
        } else if (T <= 0) {
            showError('tInput', 'tError', 'T должна быть > 0');
            isValid = false;
        } else if (T > 100) {
            showError('tInput', 'tError', 'T слишком велико (макс. 100)');
            isValid = false;
        } else {
            showSuccess('tInput');
        }

        // Валидация N
        const N = parseInt(document.getElementById('nInput').value);
        if (isNaN(N)) {
            showError('nInput', 'nError', 'Введите целое число');
            isValid = false;
        } else if (N < 10) {
            showError('nInput', 'nError', 'N должно быть ≥ 10');
            isValid = false;
        } else if (N > 50000) {
            showError('nInput', 'nError', 'N слишком велико (макс. 50000)');
            isValid = false;
        } else {
            showSuccess('nInput');
        }

        // Дополнительная проверка: λ*T не должно быть экстремально большим
        if (isValid) {
            const lambdaT = lambda * T;
            if (lambdaT > 50) {
                showError('lambdaInput', 'lambdaError', `λ·T = ${lambdaT.toFixed(2)} — слишком много событий, график будет нечитаем`);
                showError('tInput', 'tError', 'Уменьшите λ или T');
                isValid = false;
            }
        }

        return isValid;
    }

    // === ОСНОВНАЯ ФУНКЦИЯ ===
    
    function runSimulation() {
        // 1. Валидация
        if (!validateInputs()) {
            document.getElementById('logOutput').innerHTML = 
                `<span class="log-title">> Ошибка:</span>\nЗапуск отменён. Исправьте параметры.\n`;
            return;
        }

        // 2. Считываем параметры (уже проверены)
        const lambda = parseFloat(document.getElementById('lambdaInput').value);
        const T = parseFloat(document.getElementById('tInput').value);
        const N = parseInt(document.getElementById('nInput').value);

        const logDiv = document.getElementById('logOutput');
        logDiv.innerHTML = `<span class="log-title">> Моделирование:</span>\n`;
        logDiv.innerHTML += `> Параметры: λ=${lambda}, T=${T}, N=${N}\n`;
        logDiv.innerHTML += `> Теоретическое λ·T = ${(lambda*T).toFixed(3)}\n`;
        
        const resultsCounts = [];
        let totalEventsSimulated = 0;

        // 3. Основной цикл симуляции
        for (let i = 0; i < N; i++) {
            let currentTime = 0;
            let eventCountInInterval = 0;

            while (true) {
                const U = nextRandom();
                const val = 1 - U;
                // Защита от Math.log(0)
                if (val <= 0) continue;
                const dt = -Math.log(val) / lambda;
                currentTime += dt;

                if (currentTime <= T) {
                    eventCountInInterval++;
                    totalEventsSimulated++;
                } else {
                    break;
                }
            }
            resultsCounts.push(eventCountInInterval);
        }

        logDiv.innerHTML += `> Всего смоделировано событий: ${totalEventsSimulated}\n`;
        logDiv.innerHTML += `------------------------------------\n`;

        // 4. Статистический анализ
        const freqMap = {};
        let maxK = 0;

        resultsCounts.forEach(k => {
            freqMap[k] = (freqMap[k] || 0) + 1;
            if (k > maxK) maxK = k;
        });

        const mean = resultsCounts.reduce((a, b) => a + b, 0) / N;
        const variance = resultsCounts.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (N - 1);
        const indexD_E = mean > 0 ? variance / mean : 0;

        logDiv.innerHTML += `Выборочное среднее (E): ${mean.toFixed(4)}\n`;
        logDiv.innerHTML += `Выборочная дисперсия (D): ${variance.toFixed(4)}\n`;
        logDiv.innerHTML += `Индекс дисперсии (D/E): ${indexD_E.toFixed(4)}\n`;
        logDiv.innerHTML += `------------------------------------\n`;
        
        const theoMean = lambda * T;
        const meanDiff = Math.abs(mean - theoMean);
        const varDiff = Math.abs(variance - theoMean);
        
        if (meanDiff < 0.5 && varDiff < 1.0) {
            logDiv.innerHTML += `[✓ ВЫВОД] Свойства пуассоновского потока подтверждены.\n`;
            logDiv.innerHTML += `E ≈ D ≈ λ·T = ${theoMean.toFixed(3)}\n`;
        } else {
            logDiv.innerHTML += `[⚠ ВЫВОД] Наблюдаются отклонения от теории.\n`;
            logDiv.innerHTML += `Возможно, недостаточно велико N или случайная флуктуация.\n`;
        }

        // 5. Подготовка данных для графика
        const labels = [];
        const dataEmpirical = [];
        const dataTheoretical = [];
        const theoLambdaT = lambda * T;
        const limitK = Math.max(maxK, Math.ceil(theoLambdaT * 2)); 

        for (let k = 0; k <= limitK; k++) {
            labels.push(k);
            const count = freqMap[k] || 0;
            dataEmpirical.push(count / N);
            const poissonP = (Math.pow(theoLambdaT, k) * Math.exp(-theoLambdaT)) / factorial(k);
            dataTheoretical.push(poissonP);
        }

        drawChart(labels, dataEmpirical, dataTheoretical, theoLambdaT);
    }

    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let result = 1;
        for (let i = 2; i <= n; i++) result *= i;
        return result;
    }

    function drawChart(labels, empiricalData, theoreticalData, lambdaT) {
        const ctx = document.getElementById('myChart').getContext('2d');

        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Эксперимент',
                        data: empiricalData,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: `Теория (λT=${lambdaT.toFixed(2)})`,
                        data: theoreticalData,
                        type: 'line',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 2,
                        pointRadius: 3,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: '#e0e0e0' } }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Число событий k', color: '#b0b0b0' },
                        ticks: { color: '#b0b0b0' },
                        grid: { color: '#333' }
                    },
                    y: {
                        title: { display: true, text: 'Вероятность P(k)', color: '#b0b0b0' },
                        ticks: { color: '#b0b0b0' },
                        grid: { color: '#333' },
                        beginAtZero: true
                    }
                }
            }
        });
    }

    // === ОБРАБОТЧИКИ СОБЫТИЙ ДЛЯ ВАЛИДАЦИИ В РЕАЛЬНОМ ВРЕМЕНИ ===
    
    document.addEventListener('DOMContentLoaded', () => {
        ['lambdaInput', 'tInput', 'nInput'].forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('input', () => {
                // Запускаем валидацию при вводе, но не блокируем
                validateInputs();
            });
            input.addEventListener('blur', () => {
                // Полная проверка при потере фокуса
                validateInputs();
            });
        });
    });
</script>

</body>
</html>
